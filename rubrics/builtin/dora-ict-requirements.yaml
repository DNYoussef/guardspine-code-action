# DORA ICT Requirements Rubric
# GuardSpine Governance Evidence Requirements
#
# Based on Regulation (EU) 2022/2554 (Digital Operational Resilience Act),
# applicable from 17 January 2025 to EU financial entities and their ICT.
# Citations verified against the DORA articles.
#
# Maps AI-assisted code changes to DORA control THEMES an examiner asks about.
# It does NOT certify compliance; legal/compliance counsel must validate the mapping.

name: "DORA ICT Requirements (Regulation (EU) 2022/2554)"
version: "1.1.0"
description: "Rubric pack for DORA digital operational resilience evidence generation"

rules:
  - id: "DORA-CHG-ART9-4E"
    category: "ICT-ChangeManagement"
    name: "ICT Change Management"
    description: "Art 9(4)(e): ICT change management for controlled and tested changes to systems"
    severity: "high"
    patterns:
      - "change.?management|migration|deploy|rollback|release.?process|schema.*change"

  - id: "DORA-PROT-ART9"
    category: "ICT-Protection"
    name: "Protection and Prevention"
    description: "Art 9(1-3): encryption, access control, and network segmentation of ICT assets"
    severity: "high"
    patterns:
      - "encrypt|access.?control|\\brbac\\b|least.?privilege|network.?segmentation"

  - id: "DORA-DET-ART17"
    category: "ICT-Detection"
    name: "Detection and Incident Recording"
    description: "Art 10 anomaly detection; Art 17 recording/logging of ICT incidents and significant cyber threats"
    severity: "high"
    patterns:
      - "anomaly.?detect|incident.?(log|record|report)|audit.?trail|\\balert(ing)?\\b|monitoring"

  - id: "DORA-RES-ART12"
    category: "ICT-Resilience"
    name: "Response and Recovery"
    description: "Art 11-12: backup, restoration, redundancy, and business continuity for critical functions"
    severity: "high"
    patterns:
      - "backup|restore|failover|redundan|disaster.?recovery|business.?continuity|circuit.?breaker"

  - id: "DORA-TEST-ART24"
    category: "ICT-ResilienceTesting"
    name: "Digital Operational Resilience Testing"
    description: "Art 24-27: resilience testing of critical functions, incl. threat-led penetration testing (TLPT)"
    severity: "medium"
    patterns:
      - "resilience.?test|penetration.?test|\\btlpt\\b|threat.?led|chaos.?(test|engineering)|red.?team"

  - id: "DORA-3P-ART28"
    category: "ICT-ThirdPartyRisk"
    name: "ICT Third-Party Risk"
    description: "Art 28-30: third-party ICT dependency management, monitoring, and exit strategies"
    severity: "high"
    patterns:
      - "third.?party|vendor.?risk|subcontract|external.?(api|service).?dependency|exit.?strateg|supply.?chain"

  - id: "DORA-AUTH-ART9-4C"
    category: "ICT-AccessControl"
    name: "Access and Authentication"
    description: "Art 9(4)(c): identity management and strong authentication for access to ICT systems"
    severity: "high"
    patterns:
      - "authentication|access.?control|identity.?management|privileged.?access"

  - id: "DORA-PATCH-ART9-4"
    category: "ICT-PatchManagement"
    name: "Patch and Update Management"
    description: "Art 9(4): policies and procedures for patches and updates to ICT components"
    severity: "medium"
    patterns:
      - "patch.?management|update.?polic|dependency.?update|vulnerab.*patch"
