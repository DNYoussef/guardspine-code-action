# PSD2 / Strong Customer Authentication Requirements Rubric
# GuardSpine Governance Evidence Requirements
#
# Based on Directive (EU) 2015/2366 (PSD2) and the RTS on SCA & CSC
# (Commission Delegated Regulation (EU) 2018/389).
# Citations verified against EUR-Lex / EBA / legislation.gov.uk.
#
# Maps AI-assisted code changes to PSD2/SCA control THEMES an examiner asks about.
# It does NOT certify compliance; legal/compliance counsel must validate the mapping.

name: "PSD2 / SCA Requirements (EU 2015/2366 + RTS 2018/389)"
version: "1.1.0"
description: "Rubric pack for PSD2 Strong Customer Authentication evidence generation"

rules:
  - id: "PSD2-SCA-ART97"
    category: "SCA-Authentication"
    name: "Strong Customer Authentication"
    description: "PSD2 Art 97 / RTS Art 4: two independent factors on payment initiation and account access"
    severity: "critical"
    patterns:
      - "strong.?customer.?authentication|two.?factor|multi.?factor.?authentication|\\bmfa\\b"
      - "authenticat.*(payment|login|account.?access)"

  - id: "PSD2-SCA-DL-ART5"
    category: "SCA-DynamicLinking"
    name: "Dynamic Linking"
    description: "RTS Art 5: authentication code dynamically linked to a specific amount and payee; any change invalidates it"
    severity: "critical"
    patterns:
      - "dynamic.?link|link.*(amount|payee)|challenge.*amount|amount.*payee"

  - id: "PSD2-CRED-ART22"
    category: "SCA-Credentials"
    name: "Confidentiality of Security Credentials"
    description: "RTS Art 22-27: personalized security credentials protected in storage and transit; no plaintext"
    severity: "critical"
    patterns:
      - "personalized.?security.?credential"
      - "plaintext.*(password|secret|pin|otp)|store.*(credential|password|secret)"

  - id: "PSD2-CSC-ART35"
    category: "SCA-SecureComms"
    name: "Secure Communication / eIDAS Certificates"
    description: "RTS Art 34-35: qualified certificates (QWAC/QSealC) for identification and secure encryption of communication sessions"
    severity: "high"
    patterns:
      - "eidas|qwac|qseal|secure.?session|session.?encryption"

  - id: "PSD2-TRA-ART18"
    category: "SCA-Exemptions"
    name: "Transaction Risk Analysis Exemption"
    description: "RTS Art 18: low-risk TRA exemption from SCA, bounded by fraud-rate thresholds and real-time risk conditions"
    severity: "high"
    patterns:
      - "transaction.?risk.?analysis|\\btra\\b|sca.?exempt|fraud.?rate|risk.?based.?exempt"

  - id: "PSD2-XS2A-ART66"
    category: "SCA-ThirdPartyAccess"
    name: "Third-Party Provider Access (AIS/PIS)"
    description: "PSD2 Art 66-67: PISP/AISP access to accounts must be consented and access-controlled"
    severity: "high"
    patterns:
      - "\\btpp\\b|xs2a|open.?banking|aisp|pisp|account.?information.?service|payment.?initiation.?service|account.?access.?consent"

  - id: "PSD2-SESS-ART4-3D"
    category: "SCA-Session"
    name: "Access Session Timeout"
    description: "RTS Art 4(3)(d): account-access session inactivity limited to a maximum of 5 minutes"
    severity: "medium"
    patterns:
      - "session.*(timeout|expire|expir)|inactiv.*timeout|idle.?timeout"

  - id: "PSD2-EXEC-ART83"
    category: "Payment-Execution"
    name: "Execution Time and Value Date"
    description: "PSD2 Art 78-87 (incl. Art 83): authorisation, execution time and value date of payment transactions; refund rights under Art 76"
    severity: "medium"
    patterns:
      - "payment.?execution|value.?date|execution.?time|refund.?right|\\brefund\\b"
